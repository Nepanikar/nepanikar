name: Continuous Integration / GitHub release
on:
  push:
    branches: [ main ]
  workflow_dispatch: # can be triggered manually

env:
  flutter_version: '3.47.5'
  CI: false
  #  These are debug values and are not used in production (workaround for this error https://stackoverflow.com/q/54457245):
  CM_KEYSTORE_PATH: 'nepanikar_debug.keystore'
  CM_KEYSTORE_PASSWORD: 'android'
  CM_KEY_ALIAS: 'androiddebugkey'
  CM_KEY_PASSWORD: 'android'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Flutter SDK cache
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          cache: true
          cache-key: ${{ runner.OS }}-flutter-${{ env.flutter_version }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate code in packages
        # The contacts package has its own build_runner, and the root run does
        # not reach it. Its generated files used to be committed, so this gap
        # was invisible until bb8a11d stopped tracking them and every
        # CountryContacts getter went undefined.
        run: flutter pub get && flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: packages/nepanikar_contacts_gen

      - name: Generate translations
        run: flutter gen-l10n

      - name: Gradle cache
        uses: gradle/gradle-build-action@v2

      - name: Run prebuild script
        run: sh ./bin/ci_workflow_scripts/prebuild_v2.sh ${{github.run_number}}

      - name: Build apk
        run: flutter build apk --release

      - name: GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dev-0.2.${{github.run_number}}
          RELEASE_TITLE: Android build (dev-0.2.${{github.run_number}})
          RELEASE_ARTIFACT: build/app/outputs/flutter-apk/app-release.apk
        run: |
          for attempt in 1 2 3; do
            if (
              set -e
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --target "${{ github.sha }}"

                mapfile -t existing_assets < <(
                  gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
                )
                for existing_asset in "${existing_assets[@]}"; do
                  gh release delete-asset "$RELEASE_TAG" "$existing_asset" --yes
                done

                gh release upload "$RELEASE_TAG" "$RELEASE_ARTIFACT" --clobber
              else
                gh release create "$RELEASE_TAG" "$RELEASE_ARTIFACT" \
                  --title "$RELEASE_TITLE" --target "${{ github.sha }}"
              fi
            ); then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to create or update GitHub release after 3 attempts." >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done
