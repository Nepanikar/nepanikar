name: nepanikar
description: First aid for psychological issues.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  auto_size_text: ^3.0.0
  awesome_notifications: ^0.12.0
  collection: ^1.19.0
  cupertino_icons: ^1.0.5
  email_validator: ^3.0.0
  equatable: ^2.0.5
  firebase_analytics: ^12.0.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_file_dialog: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.2.17
  flutter_svg: ^2.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.0.5
  go_router: ^17.0.0
  ini: any
  intl: ^0.20.2
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  linkify: ^5.0.0
  lottie: ^3.3.0
  multi_select_flutter: ^4.1.3
  nepanikar_contacts_gen:
    path: ./packages/nepanikar_contacts_gen
  package_info_plus: ^10.1.0
  path: ^1.8.2
  path_provider: ^2.0.12
  polygon: ^0.1.0
  provider: ^6.0.5
  rxdart: ^0.28.0
  sembast: ^3.4.0+6
  shared_preferences: ^2.0.6
  time_machine: ^0.9.17
  timer_builder: ^2.0.0
  tuple: ^2.0.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
dev_dependencies:
  build_runner: ^2.7.1
  build_verify: ^3.1.1
  flutter_gen_runner: ^5.1.0+1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  go_router_builder: ^4.0.1
  json_serializable: ^6.11.2
  lint: ^2.0.1

flutter_gen:
  output: lib/app/generated/
  line_length: 100
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
  assets:
    - assets/contacts/
    - assets/icons/
    - assets/icons/checkmarks/
    - assets/icons/navigation/
    - assets/animated_illustrations/
    - assets/animated_illustrations/moods/
    - assets/illustrations/contacts/
    - assets/illustrations/moods/
    - assets/illustrations/modules/
    - assets/illustrations/games/math/
    - assets/illustrations/games/balloons/
    - assets/illustrations/games/swing/
    - assets/illustrations/games/plants/
    - assets/meals/
    - assets/sponsors/
    - assets/audio/
