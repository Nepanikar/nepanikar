<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root { --primary:#491475; --dark:#280446; --secondary:#4EA3AD; --bg:#FBF6FF; --purple200:#E2D2EF; --success:#6FD866; }
  body { font-family:'Inter',sans-serif; background:var(--bg); width:390px; min-height:844px; color:var(--dark); display:flex; flex-direction:column; }
  .appbar { background:var(--primary); color:#fff; padding:14px 20px 12px; }
  .appbar-row { display:flex; align-items:center; gap:14px; }
  .appbar .title { font-size:16px; font-weight:800; }
  .appbar .step { margin-left:auto; font-size:12px; font-weight:700; opacity:.85; }
  .progress { margin-top:12px; height:5px; border-radius:5px; background:rgba(255,255,255,.25); overflow:hidden; }
  .progress > span { display:block; height:100%; width:100%; background:#fff; border-radius:5px; }
  .content { flex:1; padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .badge { width:120px; height:120px; border-radius:50%; background:var(--purple200); display:flex; align-items:center; justify-content:center; margin-bottom:26px; position:relative; }
  .badge .emoji { font-size:58px; }
  .badge .check { position:absolute; right:4px; bottom:4px; width:38px; height:38px; border-radius:50%; background:var(--success); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; border:4px solid var(--bg); }
  .day-pill { font-size:12px; font-weight:800; color:var(--secondary); margin-bottom:14px; letter-spacing:.5px; }
  h1 { font-size:24px; font-weight:800; color:var(--primary); margin-bottom:14px; }
  p.praise { font-size:15px; line-height:1.6; color:rgba(40,4,70,.75); max-width:300px; }
  .footer { padding:14px 24px 24px; }
  .btn { width:100%; height:52px; border-radius:12px; background:var(--primary); color:#fff; font-family:inherit; font-size:16px; font-weight:900; border:none; }
</style>
</head>
<body>
  <div class="appbar">
    <div class="appbar-row"><span class="title">Den 3 · Potrava</span><span class="step">3 / 3</span></div>
    <div class="progress"><span></span></div>
  </div>
  <div class="content">
    <div class="badge"><span class="emoji">🍎</span><span class="check">✓</span></div>
    <div class="day-pill">DEN 3 DOKONČEN</div>
    <h1>Hezky!</h1>
    <p class="praise">Hodně štěstí v dnešní výzvě! Potkáme se zase zítra.</p>
  </div>
  <div class="footer"><button class="btn">Hotovo</button></div>
</body>
</html>
