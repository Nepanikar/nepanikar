<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root { --primary:#491475; --dark:#280446; --secondary:#4EA3AD; --bg:#FBF6FF; --container:#EDE8F3; --purple200:#E2D2EF; }
  body { font-family:'Inter',sans-serif; background:var(--bg); width:390px; min-height:844px; color:var(--dark); display:flex; flex-direction:column; }
  .appbar { background:var(--primary); color:#fff; padding:14px 20px 12px; }
  .appbar-row { display:flex; align-items:center; gap:14px; }
  .appbar .back { font-size:22px; opacity:.9; }
  .appbar .title { font-size:16px; font-weight:800; }
  .appbar .step { margin-left:auto; font-size:12px; font-weight:700; opacity:.85; }
  .progress { margin-top:12px; height:5px; border-radius:5px; background:rgba(255,255,255,.25); overflow:hidden; }
  .progress > span { display:block; height:100%; width:80%; background:#fff; border-radius:5px; }
  .content { flex:1; padding:24px; overflow-y:auto; }
  h2 { font-size:20px; font-weight:800; margin-bottom:8px; }
  .lead { font-size:14px; color:rgba(40,4,70,.65); line-height:1.5; margin-bottom:20px; }
  .tiles { display:flex; flex-direction:column; gap:10px; }
  .tile { background:#fff; border:1.5px solid var(--purple200); border-radius:14px; padding:12px; display:flex; gap:13px; align-items:center; }
  .tile .lt { flex:0 0 40px; height:40px; border-radius:11px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; }
  .tile .mid { flex:1; }
  .tile .mid .t { font-size:14px; font-weight:800; }
  .tile .chev { color:var(--primary); font-size:14px; opacity:.6; }
  /* expanded example */
  .tile.open { flex-direction:column; align-items:stretch; border-color:var(--primary); background:var(--purple200); }
  .tile.open .top { display:flex; gap:13px; align-items:center; }
  .tile.open .detail { font-size:13px; line-height:1.5; font-weight:500; margin-top:10px; padding-left:53px; }
  .footer { padding:14px 24px 24px; }
  .btn { width:100%; height:52px; border-radius:12px; background:var(--primary); color:#fff; font-family:inherit; font-size:16px; font-weight:900; border:none; }
</style>
</head>
<body>
  <div class="appbar">
    <div class="appbar-row"><span class="back">&larr;</span><span class="title">Den 1 · Představení</span><span class="step">8 / 10</span></div>
    <div class="progress"><span></span></div>
  </div>
  <div class="content">
    <h2>SMART cíle</h2>
    <p class="lead">Konkrétní způsob, jak si nastavit cíle tak, aby byly jasné, reálné a dosažitelné. Klepni na písmeno pro vysvětlení.</p>
    <div class="tiles">
      <div class="tile open">
        <div class="top"><span class="lt">S</span><div class="mid"><div class="t">Specifický</div></div><span class="chev">▲</span></div>
        <div class="detail">Cíl je jasně definovaný, víš přesně, čeho chceš dosáhnout.</div>
      </div>
      <div class="tile"><span class="lt">M</span><div class="mid"><div class="t">Měřitelný</div></div><span class="chev">▼</span></div>
      <div class="tile"><span class="lt">A</span><div class="mid"><div class="t">Adekvátní</div></div><span class="chev">▼</span></div>
      <div class="tile"><span class="lt">R</span><div class="mid"><div class="t">Relevantní</div></div><span class="chev">▼</span></div>
      <div class="tile"><span class="lt">T</span><div class="mid"><div class="t">Termínovaný</div></div><span class="chev">▼</span></div>
    </div>
  </div>
  <div class="footer"><button class="btn">Pojďme si nastavit cíl</button></div>
</body>
</html>
